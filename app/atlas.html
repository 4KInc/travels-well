<!doctype html><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Taste Atlas — Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;450;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ui.css">

<div class="bar">
  <span class="brand">Taste Atlas <span>/ Map</span></span>
  <nav>
    <a href="/">Pitch desk</a>
    <a href="/atlas" aria-current="page">Map</a>
    <a href="/slate">Slate</a>
  </nav>
  <span class="sp"></span>
  <span class="meta" id="topmeta"></span>
  <nav><a href="https://github.com/4KInc/travels-well">Source</a></nav>
</div>

<div class="shell">
  <aside class="side">
    <div class="grp">
      <h2>Home audience</h2>
      <p class="help">The audience your slate already plays to. Pick one to route
      films against it.</p>
      <select id="home"><option value="">None — show each audience on its own</option></select>
    </div>

    <div class="grp">
      <h2>Audiences <span class="cnt" id="ncount"></span></h2>
      <div class="rows" id="list"></div>
    </div>

    <div class="grp">
      <h2>Legend</h2>
      <div class="legend">
        <span><i class="swatch" style="background:#3987e5"></i>music</span>
        <span><i class="swatch" style="background:#e8b84b"></i>television</span>
        <span><i class="swatch" style="background:#39c08a"></i>games</span>
        <span><i class="swatch" style="background:#b98ae0"></i>mixed</span>
        <span><i class="swatch" style="border:1.5px dashed #6b7280"></i>single reading</span>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="canvas">
      <svg id="map" viewBox="0 0 1000 620" role="img"
        aria-label="Audiences positioned by taste similarity"></svg>
      <div class="zoom">
        <button id="zin" title="Zoom in" aria-label="Zoom in">+</button>
        <button id="zout" title="Zoom out" aria-label="Zoom out">&minus;</button>
        <button id="zfit" title="Reset view" aria-label="Reset view">&#9633;</button>
      </div>
      <span class="hintline">drag to pan · scroll to zoom · drag a node to rearrange</span>
    </div>
    <div class="rhead">
      <div class="rtitle"><h1 id="rtitle">&nbsp;</h1><span class="pill" id="rpill"></span></div>
      <div class="stats" id="rstats"></div>
      <div class="tabs" id="tabs"></div>
    </div>
    <div id="panes"></div>
  </main>
</div>

<script src="/ui.js"></script>
<script>

const DOMAIN_COLOR={artist:'#3987e5',tv_show:'#e8b84b',videogame:'#39c08a',mixed:'#b98ae0'};
const W=1000,H=620,PAD=84;
let view={k:1,x:0,y:0}, root=null, svg=null, NODES=[], EDGES=[], byId={};
let HOME=null, CURRENT=null, ART={}, META=null, TAB=0;

fetch('/api/atlas').then(r=>r.json()).then(d=>{ART=d.art||{};META=d;draw(d)});

function dominant(members){
  const c={}; members.forEach(m=>c[m.domain]=(c[m.domain]||0)+1);
  const top=Object.entries(c).sort((a,b)=>b[1]-a[1]);
  if(top.length>1 && top[0][1]===top[1][1]) return 'mixed';
  return top[0][1]/members.length>=0.6?top[0][0]:'mixed';
}
const applyView=()=>root.setAttribute('transform',
  `translate(${view.x},${view.y}) scale(${view.k})`);
function zoomAt(cx,cy,f0){
  const k=Math.min(4,Math.max(0.5,view.k*f0)), f=k/view.k;
  view.x=cx-(cx-view.x)*f; view.y=cy-(cy-view.y)*f; view.k=k; applyView();
}
function svgPoint(ev){
  const r=svg.getBoundingClientRect();
  return {x:(ev.clientX-r.left)/r.width*W,y:(ev.clientY-r.top)/r.height*H};
}

function draw(d){
  const st=d.stability_at_threshold;
  document.getElementById('topmeta').innerHTML =
    '<b>'+d.nodes.length+'</b> audiences &nbsp; <b>'+d.built_from.anchors+
    '</b> anchors &nbsp; <b>'+d.built_from.films+'</b> films' +
    (st? ' &nbsp; <b>'+Math.round(100*st.survived_80pct/st.within_cluster_pairs)+
      '%</b> stable':'');
  document.getElementById('ncount').textContent=d.nodes.length;

  svg=document.getElementById('map');
  NODES=d.nodes; EDGES=d.edges;
  NODES.forEach(n=>{ byId[n.id]=n;
    n.px=PAD+n.x*(W-2*PAD); n.py=PAD+n.y*(H-2*PAD);
    n.r=13+n.size*2.3; n.dom=dominant(n.members); });

  const defs=svgEl('defs',{});
  NODES.forEach(n=>{
    const art=(n.loves||[]).find(f=>f.image); if(!art) return;
    const pat=svgEl('pattern',{id:'pat-'+n.id,patternContentUnits:'objectBoundingBox',
      width:1,height:1});
    const im=svgEl('image',{href:art.image,width:1,height:1,
      preserveAspectRatio:'xMidYMid slice'});
    im.setAttributeNS('http://www.w3.org/1999/xlink','xlink:href',art.image);
    pat.appendChild(im); defs.appendChild(pat);
  });
  svg.appendChild(defs);

  root=svgEl('g',{}); svg.appendChild(root);
  const edgeLayer=svgEl('g',{}), nodeLayer=svgEl('g',{});
  root.appendChild(edgeLayer); root.appendChild(nodeLayer);

  EDGES.forEach(e=>{
    const a=byId[e.a],b=byId[e.b];
    e.el=svgEl('line',{x1:a.px,y1:a.py,x2:b.px,y2:b.py,class:'edge',
      'stroke-width':Math.max(.5,(e.w-.45)*6),'stroke-opacity':.45});
    edgeLayer.appendChild(e.el);
  });

  const placed=[];
  NODES.forEach(n=>{
    const g=svgEl('g',{class:'node',tabindex:0,role:'button'});
    const colour=DOMAIN_COLOR[n.dom]||DOMAIN_COLOR.mixed;
    const disc=svgEl('circle',{cx:n.px,cy:n.py,r:n.r,class:'disc',
      fill:(n.loves||[]).some(f=>f.image)?'url(#pat-'+n.id+')':'#1a1d22'});
    const veil=svgEl('circle',{cx:n.px,cy:n.py,r:n.r,class:'veil'});
    const ring=svgEl('circle',{cx:n.px,cy:n.py,r:n.r,class:'ring',stroke:colour});
    // A cluster too small to split into halves that can disagree has never been
    // cross-checked. Say so on the map, not only in the limitations.
    if(n.halves_agree==null) ring.setAttribute('stroke-dasharray','4 3');
    g.appendChild(disc); g.appendChild(veil); g.appendChild(ring);

    const label=(n.tags&&n.tags.length?n.tags.slice(0,2).join(' · '):(n.short||n.label));
    const halfW=label.length*3.1;
    let anchor='middle', tx=n.px;
    if(n.px-halfW<6){anchor='start';tx=Math.max(n.px-n.r,6)}
    else if(n.px+halfW>W-6){anchor='end';tx=Math.min(n.px+n.r,W-6)}
    let ty=n.py+n.r+15, guard=0;
    const hitsLabel=()=>placed.some(p=>Math.abs(p.y-ty)<12&&Math.abs(p.x-tx)<(halfW+p.w));
    const hitsNode=()=>NODES.some(b=>Math.abs(b.py-ty)<b.r+7&&Math.abs(b.px-tx)<halfW+b.r);
    while(guard++<40&&(hitsLabel()||hitsNode())) ty+=13;
    placed.push({x:tx,y:ty,w:halfW});
    const t=svgEl('text',{x:tx,y:ty,'text-anchor':anchor});
    t.textContent=label; g.appendChild(t);
    n.g=g; n.parts={disc,veil,ring,t}; n.labelDX=tx-n.px; n.labelDY=ty-n.py;

    g.addEventListener('keydown',ev=>{
      if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();select(n)}});
    g.addEventListener('pointerenter',()=>highlight(n));
    g.addEventListener('pointerleave',()=>highlight(null));

    let dragging=false, moved=false, grab=null;
    g.addEventListener('pointerdown',ev=>{
      ev.stopPropagation(); dragging=true; moved=false;
      const p=svgPoint(ev);
      grab={x:(p.x-view.x)/view.k-n.px,y:(p.y-view.y)/view.k-n.py};
      g.setPointerCapture(ev.pointerId);
    });
    g.addEventListener('pointermove',ev=>{
      if(!dragging) return;
      const p=svgPoint(ev);
      const nx=(p.x-view.x)/view.k-grab.x, ny=(p.y-view.y)/view.k-grab.y;
      if(Math.hypot(nx-n.px,ny-n.py)>2) moved=true;
      n.px=nx; n.py=ny; reposition(n);
    });
    g.addEventListener('pointerup',ev=>{
      dragging=false; g.releasePointerCapture(ev.pointerId);
      if(!moved) select(n);
    });
    nodeLayer.appendChild(g);
  });

  let panning=false, from=null;
  svg.addEventListener('pointerdown',ev=>{
    panning=true; from=svgPoint(ev); svg.classList.add('panning');
    svg.setPointerCapture(ev.pointerId);
  });
  svg.addEventListener('pointermove',ev=>{
    if(!panning) return;
    const p=svgPoint(ev); view.x+=p.x-from.x; view.y+=p.y-from.y; from=p; applyView();
  });
  const endPan=ev=>{panning=false;svg.classList.remove('panning');
    try{svg.releasePointerCapture(ev.pointerId)}catch(e){}};
  svg.addEventListener('pointerup',endPan);
  svg.addEventListener('pointercancel',endPan);
  svg.addEventListener('wheel',ev=>{
    ev.preventDefault(); const p=svgPoint(ev);
    zoomAt(p.x,p.y,ev.deltaY<0?1.12:1/1.12);
  },{passive:false});
  document.getElementById('zin').onclick=()=>zoomAt(W/2,H/2,1.25);
  document.getElementById('zout').onclick=()=>zoomAt(W/2,H/2,1/1.25);
  document.getElementById('zfit').onclick=()=>{view={k:1,x:0,y:0};applyView()};

  // sidebar list and home picker are two doors into the same selection
  const list=document.getElementById('list');
  NODES.forEach(n=>{
    const b=el('button','rowbtn'); b.setAttribute('aria-selected','false');
    b.appendChild(el('span','t',n.name||n.label));
    b.appendChild(el('span','s',n.members.length+' anchors · '+
      (n.halves_agree==null?'single reading':'agree '+n.halves_agree.toFixed(2))));
    b.onclick=()=>select(n); n.btn=b; list.appendChild(b);
  });

  const sel=document.getElementById('home');
  NODES.forEach(n=>{
    const o=document.createElement('option');
    o.value=n.id; o.textContent=(n.name?n.name+' — ':'')+n.label;
    sel.appendChild(o);
  });
  sel.addEventListener('change',()=>{
    HOME=byId[sel.value]||null;
    NODES.forEach(n=>n.parts.ring.setAttribute('stroke-dasharray',
      HOME&&n.id===HOME.id ? '5 4' : (n.halves_agree==null?'4 3':'')));
    TAB=0; if(CURRENT) select(CURRENT);
  });

  select(NODES[0]);
}

function reposition(n){
  const {disc,veil,ring,t}=n.parts;
  [disc,veil,ring].forEach(c=>{c.setAttribute('cx',n.px);c.setAttribute('cy',n.py)});
  t.setAttribute('x',n.px+n.labelDX); t.setAttribute('y',n.py+n.labelDY);
  EDGES.forEach(e=>{
    if(e.a===n.id){e.el.setAttribute('x1',n.px);e.el.setAttribute('y1',n.py)}
    if(e.b===n.id){e.el.setAttribute('x2',n.px);e.el.setAttribute('y2',n.py)}
  });
}

function highlight(n){
  if(!n){
    NODES.forEach(x=>x.g.classList.remove('faded'));
    EDGES.forEach(e=>{e.el.classList.remove('faded');e.el.setAttribute('stroke','#4b5260')});
    return;
  }
  const near=new Set([n.id]);
  EDGES.forEach(e=>{if(e.a===n.id)near.add(e.b);if(e.b===n.id)near.add(e.a)});
  NODES.forEach(x=>x.g.classList.toggle('faded',!near.has(x.id)));
  EDGES.forEach(e=>{
    const on=e.a===n.id||e.b===n.id;
    e.el.classList.toggle('faded',!on);
    e.el.setAttribute('stroke',on?(DOMAIN_COLOR[n.dom]||'#4b5260'):'#4b5260');
  });
}

function route(home,target){
  // Both signatures are already on the page, so routing one audience against
  // another costs nothing: the shift is the difference in rank position, over
  // the films both audiences actually rank.
  const withheld=new Set([...(home.uncertain||[]),...(target.uncertain||[])]);
  const rows=[];
  for(const f in target.ranks){
    if(!(f in home.ranks)||withheld.has(f)) continue;
    rows.push({title:f,image:ART[f],shift:target.ranks[f]-home.ranks[f]});
  }
  rows.sort((a,b)=>b.shift-a.shift);
  return {rows,withheld:[...withheld]};
}

function select(n){
  if(!n) return;
  CURRENT=n;
  NODES.forEach(x=>{x.g.classList.toggle('sel',x.id===n.id);
    if(x.btn) x.btn.setAttribute('aria-selected',String(x.id===n.id))});

  document.getElementById('rtitle').textContent=n.name||n.label;
  const pill=document.getElementById('rpill');
  const crossed=n.halves_agree!=null;
  pill.textContent=crossed?'cross-checked':'single reading';
  pill.className='pill '+(crossed?'LIVE':'UNAVAILABLE');

  const routed = HOME && HOME.id!==n.id ? route(HOME,n) : null;
  const stats=document.getElementById('rstats'); stats.innerHTML='';
  const add=(k,v)=>{const s=el('span');s.appendChild(document.createTextNode(k+' '));
    s.appendChild(el('b',null,v));stats.appendChild(s)};
  add('anchors',n.members.length);
  if(crossed) add('halves agree',n.halves_agree.toFixed(2));
  if(routed){ add('home',HOME.name||HOME.label); add('compared on',routed.rows.length);
    if(routed.withheld.length) add('withheld',routed.withheld.length); }
  else if(HOME && HOME.id===n.id) add('','this is your home audience');

  const tabs=[];
  if(routed) tabs.push({name:'Against home',n:routed.rows.length,build:()=>{
    const p=el('div','pane');
    if(!routed.rows.length){p.appendChild(el('p','empty',
      'No film is ranked by both audiences, so there is nothing to compare.'));return p}
    p.appendChild(el('p','note','Rank position in '+(n.name||n.label)+
      ' minus rank position in '+(HOME.name||HOME.label)+
      ', over the '+routed.rows.length+' films both audiences rank. Positive means the film climbs when you leave home.'));
    p.appendChild(shiftTable(routed.rows));
    const single=[HOME,n].filter(x=>x.halves_agree==null).map(x=>x.name||x.label);
    if(single.length) p.appendChild(el('p','warn',
      'Single reading, not cross-checked: '+single.join(' and ')+
      '. Audiences of two or three anchors cannot be split into halves that '+
      'disagree, so nothing was withheld on their account.'));
    return p;
  }});
  tabs.push({name:'Draws',n:(n.loves||[]).length,build:()=>{
    const p=el('div','pane');
    p.appendChild(el('h3','sec','Films this audience is drawn to'));
    p.appendChild(gallery(n.loves||[]));
    p.appendChild(el('h3','sec','Films it is not'));
    p.appendChild(gallery(n.leaves||[],true));
    return p;
  }});
  tabs.push({name:'Members',n:n.members.length,build:()=>{
    const p=el('div','pane');
    p.appendChild(el('p','note',n.name
      ? 'Named from the tags its members share, not by us. Every anchor whose film-affinity signature put it in this cluster:'
      : 'Every anchor whose film-affinity signature put it in this cluster:'));
    const c=el('div','chips');
    n.members.forEach(m=>{
      const s=el('span','chip');
      s.appendChild(el('i',null,m.domain.replace('_',' ')));
      s.appendChild(document.createTextNode(m.name));
      s.querySelector('i').style.cssText='font-style:normal;color:var(--ink-3);font-size:11px';
      c.appendChild(s);
    });
    p.appendChild(c);
    if(n.tags&&n.tags.length){
      p.appendChild(el('h3','sec','Shared tags'));
      const tc=el('div','chips');
      n.tags.forEach(t=>tc.appendChild(el('span','chip',t)));
      p.appendChild(tc);
    }
    return p;
  }});
  tabs.push({name:'Method',build:()=>{
    const p=el('div','pane');
    p.appendChild(el('p','note',
      'City is the wrong unit, and the API says so: in Qloo’s model location does '+
      'not move film affinity at all — the same films come back in the same order '+
      'across five cities. What does move it is what an audience listens to and watches. '+
      'So these groups are not places.'));
    p.appendChild(el('p','note',
      'Built from '+META.built_from.anchors+' anchors across music, television and games, '+
      'scored against '+META.built_from.films+' films. Clusters are joined by average '+
      'linkage at correlation 0.75 — the tightness measured to survive resampling of '+
      'the film set; looser grouping produced one large cluster that dissolved under the '+
      'same test. Anchors that joined no cluster are left off the map rather than forced '+
      'into one. Distance on the map is taste distance, by classical scaling of the '+
      'correlation matrix.'));
    p.appendChild(el('p','note',
      'These are discovered taste communities within Qloo’s graph — clusters of '+
      'cultural anchors grouped by modelled film affinity, not observed groups of people. '+
      'Only the clusters large enough to split can be cross-checked against themselves; '+
      'the rest are marked single reading, here and on the map.'));
    p.appendChild(el('p','note','The map is precomputed, so opening it spends no Qloo calls.'));
    return p;
  }});

  tabs.forEach((t,i)=>t.onpick=j=>{TAB=j});
  TAB=mountTabs(document.getElementById('tabs'),document.getElementById('panes'),tabs,TAB);
}
</script>
