<!doctype html><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Taste Atlas — Pitch desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;450;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ui.css">

<div class="bar">
  <span class="brand">Taste Atlas <span>/ Pitch desk</span></span>
  <nav>
    <a href="/" aria-current="page">Pitch desk</a>
    <a href="/atlas">Map</a>
    <a href="/slate">Slate</a>
  </nav>
  <span class="sp"></span>
  <span class="meta" id="quota"></span>
  <nav><a href="https://github.com/4KInc/travels-well">Source</a></nav>
</div>

<div class="shell">
  <aside class="side">
    <div class="grp" id="g-slate"></div>
    <div class="grp" id="g-buyer"></div>
    <div class="grp" id="g-home"></div>
    <button class="run" id="run">Rank slate</button>
    <button class="reset" id="reset">Reset to the worked example</button>
  </aside>
  <main class="main">
    <div class="rhead">
      <div class="rtitle"><h1 id="rh">Ranking…</h1><span id="src"></span></div>
      <div class="stats" id="stats"></div>
      <div class="tabs" id="tabs"></div>
    </div>
    <div id="pane" class="pane"></div>
  </main>
</div>

<script src="/ui.js"></script>
<script>
const EX={
 slate:['3 Idiots','Dangal','RRR','Sholay','Gully Boy','City of God','Elite Squad','La Haine',
        'Parasite','Amelie','Lagaan','Barfi!'],
 buyer:['The Wire','The Sopranos','Breaking Bad','Narcos','Snowfall','Goodfellas','Scarface','Training Day'],
 home:['Kabhi Khushi Kabhie Gham','Dilwale Dulhania Le Jayenge','Kuch Kuch Hota Hai','Jab We Met',
       'Yeh Jawaani Hai Deewani','Zindagi Na Milegi Dobara']};
const state={slate:[...EX.slate],buyer:[...EX.buyer],home:[...EX.home]};
let DATA=null, TAB='shortlist';

const $=id=>document.getElementById(id);

const GROUPS=[
 {key:'slate', id:'g-slate', label:'Your slate', help:'Titles you are selling.'},
 {key:'buyer', id:'g-buyer', label:'Buyer', help:'What they have already licensed.'},
 {key:'home',  id:'g-home',  label:'Home audience', help:'Optional. What already works for you.'}];

function drawInputs(){
  GROUPS.forEach(g=>{
    const box=$(g.id); box.innerHTML='';
    const h=el('h2'); h.appendChild(document.createTextNode(g.label));
    h.appendChild(el('span','cnt',state[g.key].length+''));
    box.appendChild(h);
    box.appendChild(el('p','help',g.help));
    const chips=el('chips'.replace('chips','div'),'chips');
    state[g.key].forEach((t,i)=>{
      const miss=DATA&&DATA.slate&&g.key==='slate'&&(DATA.slate.missing||[]).includes(t);
      const c=el('span','chip'+(miss?' miss':''));
      c.appendChild(document.createTextNode(t));
      const b=el('button',null,'×'); b.title='Remove';
      b.onclick=()=>{state[g.key].splice(i,1);drawInputs()};
      c.appendChild(b); chips.appendChild(c);
    });
    box.appendChild(chips);
    const inp=el('input'); inp.type='text'; inp.placeholder='Add a title…';
    inp.onkeydown=e=>{ if(e.key==='Enter'&&inp.value.trim()){
      state[g.key].push(inp.value.trim()); inp.value=''; drawInputs(); } };
    box.appendChild(inp);
  });
}

function run(){
  $('run').disabled=true;
  $('rh').textContent='Ranking…'; $('src').innerHTML=''; $('stats').innerHTML='';
  $('tabs').innerHTML=''; $('pane').innerHTML='';
  for(let i=0;i<6;i++) $('pane').appendChild(el('div','skel'));
  fetch('/api/pitch',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(state)})
    .then(r=>r.json()).then(d=>{DATA=d;drawInputs();render()})
    .catch(e=>{$('pane').innerHTML='';$('pane').appendChild(el('p','empty',String(e)))})
    .finally(()=>{$('run').disabled=false});
}

function render(){
  const d=DATA, pane=$('pane');
  if(d.error){ $('rh').textContent='Could not rank'; pane.innerHTML='';
    pane.appendChild(el('p','note',d.error)); return; }
  $('rh').textContent='Shortlist for this buyer';
  $('src').innerHTML='<span class="pill '+(d.source||'')+'">'+(d.source||'')+'</span>';
  const st=$('stats'); st.innerHTML='';
  const put=(k,v)=>{const s=el('span');s.appendChild(document.createTextNode(k+' '));
    s.appendChild(el('b',null,v));st.appendChild(s)};
  put('slate',d.slate.resolved+' titles');
  put('buyer',d.buyer.resolved.length+' titles');
  if(d.buyer.halves_agree!=null) put('halves agree',d.buyer.halves_agree.toFixed(2));
  if(d.absolute) put('affinity',d.absolute.worst.toFixed(3)+'–'+d.absolute.best.toFixed(3));
  if(d.calls) put('qloo calls',d.calls);

  const tabs=[['shortlist','Shortlist',d.rows.length],
              ['withheld','Withheld',(d.withheld||[]).length],
              ['trace','How it decided',(d.steps||[]).length],
              ['ablation','Without Qloo',null],
              ['method','Method',null]];
  const tb=$('tabs'); tb.innerHTML='';
  tabs.forEach(([k,label,n])=>{
    const b=el('button',null,label); b.setAttribute('aria-selected',String(TAB===k));
    if(n!=null) b.appendChild(el('span','n',String(n)));
    b.onclick=()=>{TAB=k;render()}; tb.appendChild(b);
  });
  pane.innerHTML='';
  ({shortlist:paneShortlist,withheld:paneWithheld,trace:paneTrace,
    ablation:paneAblation,method:paneMethod}[TAB])(pane,d);
}

function paneShortlist(p,d){
  if(d.low_separation){
    const w=el('div','warn');
    w.innerHTML='<b>Low separation.</b> This buyer’s catalogue barely '
      +'distinguishes your titles from one another, so treat the top few as a '
      +'group rather than a strict order.';
    p.appendChild(w);
  }
  // One line here; the full definition lives in the Method tab.
  p.appendChild(el('p','note','Place is a rank among the titles you offered, not '
    +'a score \u2014 the raw affinity beside it is the absolute reading.'));
  const t=el('table');
  t.innerHTML='<thead><tr><th style="width:40px"></th><th>Title</th>'
    +'<th class="n" style="width:72px">Place</th>'
    +'<th class="n" style="width:74px">Affinity</th>'
    +'<th style="width:120px;padding-left:16px">Relative</th>'
    +'<th class="n" style="width:78px">Vs home</th></tr></thead>';
  const b=el('tbody');
  d.rows.forEach(r=>{
    const tr=el('tr');
    const td0=el('td');
    if(r.image){const im=new Image();im.className='poster';im.src=r.image;im.alt='';im.loading='lazy';td0.appendChild(im)}
    tr.appendChild(td0);
    const td1=el('td'); td1.appendChild(el('div','ttl',r.title));
    if(r.note) td1.appendChild(el('div','flag',r.note));
    if(r.invariant) td1.appendChild(el('div','flag','ranks the same for every buyer'));
    tr.appendChild(td1);
    tr.appendChild(el('td','n num',r.place||''));
    tr.appendChild(el('td','n num',r.affinity!=null?r.affinity.toFixed(3):'—'));
    const td4=el('td','bar-cell'); td4.style.paddingLeft='16px';
    const mini=el('div','mini'), f=el('i');
    f.style.left='0'; f.style.width=Math.round((r.fit||0)*100)+'%';
    mini.appendChild(f); td4.appendChild(mini); tr.appendChild(td4);
    const td5=el('td','n num '+(r.shift>=0?'up':'down'));
    td5.textContent=typeof r.shift==='number'?fmt(r.shift):'—';
    tr.appendChild(td5);
    b.appendChild(tr);
  });
  t.appendChild(b); p.appendChild(t);
  if(d.uncomparable&&d.uncomparable.length)
    p.appendChild(el('p','note','Scored for the buyer but not comparable against home: '
      +d.uncomparable.map(r=>r.title).join(', ')+'. Reporting them as no movement would be false.'));
}

function paneWithheld(p,d){
  const w=d.withheld||[];
  if(!w.length){ p.appendChild(el('p','empty','Nothing withheld: the two halves of the buyer’s catalogue agreed about every title.')); return; }
  p.appendChild(el('p','note','The buyer’s catalogue was split in two and read '
    +'separately. These titles landed in very different places in the two readings, '
    +'so no verdict is offered on them.'));
  const g=el('div','gal dim');
  w.forEach(t=>{const f=el('figure');
    const im=new Image(); im.src=(d.art&&d.art[t])||''; im.alt='';
    f.appendChild(im); f.appendChild(el('figcaption',null,t)); g.appendChild(f)});
  p.appendChild(g);
  if(d.excluded_overlap&&d.excluded_overlap.length)
    p.appendChild(el('p','note','Removed before scoring because they also describe the buyer: '
      +d.excluded_overlap.join(', ')+'. Qloo excludes an entity from its own results.'));
}

function paneTrace(p,d){
  p.appendChild(el('p','note','Each line is a decision. Where a reading was too '
    +'flat to separate anything, or two halves of a catalogue disagreed, the agent '
    +'changed what it did next.'));
  const ol=el('ol','steps');
  (d.steps||[]).forEach(s=>{
    const li=el('li');
    li.appendChild(el('div','who '+(s.profile||''),s.profile||''));
    const body=el('div');
    body.appendChild(el('div','act',s.action));
    if(s.reason) body.appendChild(el('div','why',s.reason));
    if(s.observed) body.appendChild(el('div','obs',s.observed));
    if(s.changed) body.appendChild(el('div','did','↪ '+s.changed));
    li.appendChild(body); ol.appendChild(li);
  });
  p.appendChild(ol);
}

function paneAblation(p,d){
  const l=d.llm;
  if(!l||!l.available){ p.appendChild(el('p','empty',(l&&l.note)||'No comparison available.')); return; }
  p.appendChild(el('p','note','The same question put to a language model that sees '
    +'only the two title lists — no Qloo, no affinities.'));
  const st=el('div','stats');
  const put=(k,v)=>{const s=el('span');s.appendChild(document.createTextNode(k+' '));
    s.appendChild(el('b',null,v));st.appendChild(s)};
  if(typeof l.top5_overlap==='number'){
    put('top five',l.top5_overlap+' of 5 shared');
    put('it would open with',(5-l.top5_overlap)+' different title'+(5-l.top5_overlap===1?'':'s'));
  }
  if(l.agreement!=null) put('full-list agreement',l.agreement.toFixed(2));
  p.appendChild(st);
  if(l.disagreements&&l.disagreements.length){
    const t=el('table');
    t.innerHTML='<thead><tr><th>Title</th><th class="n">Qloo</th><th class="n">LLM only</th></tr></thead>';
    const b=el('tbody');
    l.disagreements.forEach(x=>{const tr=el('tr');
      tr.appendChild(el('td','ttl',x.title));
      tr.appendChild(el('td','n num up','#'+x.qloo_place));
      tr.appendChild(el('td','n num down','#'+x.llm_place));
      b.appendChild(tr)});
    t.appendChild(b); p.appendChild(t);
  }
  p.appendChild(el('h3','sec','What this does and does not show'));
  p.appendChild(el('p','note','A frontier model is a strong baseline here and we are '
    +'not claiming otherwise: across every buyer and slate tried, including obscure '
    +'titles, it shares three to four of the top five, and it is perfectly repeatable '
    +'at temperature zero. What it cannot do is decline — it ranked every title '
    +'confidently, where this run withheld '+((d.withheld||[]).length)+' and can report '
    +'which titles rank the same for every buyer.'));
}

function paneMethod(p,d){
  const add=(h,t)=>{p.appendChild(el('h3','sec',h));p.appendChild(el('p','note',t))};
  add('Measured on the hackathon endpoint, not read from the docs',
    'filter.location.query is silently ignored for movies — affinities come back '
    +'identical to four decimals across five cities — though it is honoured for '
    +'places. Affinity is not normalised per candidate set; it varies with the signal. '
    +'query.affinity is the taste score and popularity sits beside it, identical in '
    +'every market. take is capped at 50. Cross-domain signal varies enormously: TV '
    +'0.06, games 0.08, music 0.11 discriminate film taste; books, podcasts and places '
    +'barely or not at all.');
  add('What the numbers here mean',
    'Place is a rank among the titles you offered, not a score: first place reads first '
    +'even if this buyer is lukewarm about everything, which is why the raw affinity is '
    +'shown beside it. Vs home is that place minus its place with your home audience.');
  add('Validation, including where it fails',
    '11 of 11 regionally-skewed films rank highest with their own home audience '
    +'(p = 0.0005) — a validity check rather than a finding, since we chose which '
    +'films count as regional. 10 of 11 survive replacing every anchor artist '
    +'(p = 0.0059), which is the result with weight. Cluster membership survives '
    +'bootstrap resampling for 67% of pairings. An external backtest against Wikipedia '
    +'pageview ranks, collected before any Qloo call, agrees in Mumbai and Berlin and '
    +'not in the other three markets.');
  add('What is not claimed',
    'The map’s eighteen audiences are clusters of cultural anchors grouped by '
    +'modelled film affinity — communities within Qloo’s graph, not observed '
    +'groups of people. Fifteen have too few members to cross-check and are drawn dashed. '
    +'The two readings of any audience share no anchors but come from the same graph, so '
    +'their agreement is a consistency check, not independent corroboration.');
  const a=el('p','note'); a.innerHTML='Everything above is reproducible from the '
    +'<a href="https://github.com/4KInc/travels-well" style="color:var(--accent)">repository</a>: '
    +'run_all.py for the API harness, atlas_build.py for the clustering and bootstrap. '
    +'The pre-registration and both amendments are committed.';
  p.appendChild(a);
}

$('run').onclick=run;
$('reset').onclick=()=>{state.slate=[...EX.slate];state.buyer=[...EX.buyer];state.home=[...EX.home];
  drawInputs();run()};
fetch('/status').then(r=>r.json()).then(s=>{
  if(s.quota_remaining!=null)
    $('quota').innerHTML='qloo quota <b>'+s.quota_remaining.toLocaleString()+'</b>';
}).catch(()=>{});
drawInputs(); run();
</script>
