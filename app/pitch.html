<!doctype html><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pitch Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* The pitch desk is a workspace, not a page you scroll -- two panes, dense
   tables, tabs. But it wears the same house style as the map and the slate
   view: the amber, the film strip, Bebas on the headings. */
:root{color-scheme:dark;
  --screen:#0a0a0c;--seat:#141419;--seat-2:#1c1c23;--ink:#f4f1ea;--ink-2:#a9a49a;
  --ink-3:#6f6b64;--rule:#26262e;--bulb:#e8b84b;--pos:#3987e5;--neg:#e66767;
  --display:"Bebas Neue",Impact,sans-serif;
  --sans:Inter,ui-sans-serif,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--screen);color:var(--ink);
  font:400 14px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--bulb)}

/* ---------- shared nav, identical to the other two screens ---------- */
.topnav{position:sticky;top:0;z-index:20;display:flex;align-items:center;
  justify-content:center;gap:clamp(10px,2.5vw,26px);flex-wrap:wrap;
  padding:11px clamp(14px,3.5vw,32px);background:rgba(10,10,12,.86);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.topnav .mark{font:400 19px/1 var(--display);letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink);margin-right:4px}
.topnav .mark b{color:var(--bulb);font-weight:400}
.topnav a{font:400 11px/1 var(--mono);letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);text-decoration:none;padding:6px 2px;border-bottom:1px solid transparent}
.topnav a:hover{color:var(--ink)}
.topnav a[aria-current=page]{color:var(--ink);border-bottom-color:var(--bulb)}
.topnav .spacer{flex:1 1 0;min-width:0}
.topnav .quota{font:400 10.5px/1 var(--mono);letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3)}
.topnav .quota b{color:var(--ink-2);font-weight:400}
@media (max-width:620px){.topnav{gap:12px}.topnav .spacer{display:none}}
.strip{height:11px;border-bottom:1px solid var(--rule);
  background:repeating-linear-gradient(90deg,transparent 0 9px,var(--rule) 9px 15px)}

/* ---------- two panes ---------- */
.shell{display:grid;grid-template-columns:304px 1fr;height:calc(100vh - 58px)}
@media (max-width:900px){.shell{grid-template-columns:1fr;height:auto}}
.side{border-right:1px solid var(--rule);background:var(--seat);
  overflow-y:auto;padding:16px 15px 30px}
.main{overflow-y:auto;padding:0 0 48px;min-width:0}

.grp{margin-bottom:20px}
.grp h2{font:400 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 3px;display:flex;align-items:baseline;gap:6px}
.grp .cnt{margin-left:auto;font:400 11px var(--mono);color:var(--ink-3)}
p.help{font-size:12px;color:var(--ink-3);margin:0 0 8px;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:7px}
.chip{display:inline-flex;align-items:center;gap:6px;font:400 12px/1 var(--sans);
  padding:5px 6px 5px 9px;background:var(--seat-2);border:1px solid var(--rule);
  border-radius:2px;color:var(--ink-2)}
.chip button{all:unset;cursor:pointer;color:var(--ink-3);font-size:13px;line-height:1}
.chip button:hover{color:var(--neg)}
.chip.miss{border-color:color-mix(in oklab,var(--neg) 45%,transparent);color:var(--neg)}
input[type=text]{width:100%;background:var(--screen);border:1px solid var(--rule);
  color:var(--ink);border-radius:2px;padding:7px 9px;font:400 13px/1.4 var(--sans)}
input[type=text]:focus-visible{outline:2px solid var(--bulb);outline-offset:1px}
.run{width:100%;margin-top:6px;background:var(--bulb);color:#140f02;border:1px solid var(--bulb);
  border-radius:2px;padding:11px 10px 9px;font:400 21px/1 var(--display);
  letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
.run:hover{filter:brightness(1.06)}
.run[disabled]{opacity:.5;cursor:default}
.reset{all:unset;cursor:pointer;font:400 11px/1 var(--mono);letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);margin-top:12px;display:block}
.reset:hover{color:var(--ink-2)}

/* ---------- the readout ---------- */
.rhead{padding:18px 22px 0;border-bottom:1px solid var(--rule)}
.rtitle{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.rtitle h1{font:400 clamp(27px,3.2vw,36px)/1 var(--display);letter-spacing:.02em;
  text-transform:uppercase;margin:0}
.pill{font:500 10.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  padding:4px 7px;border-radius:2px;border:1px solid currentColor}
.pill.LIVE{color:var(--pos)} .pill.CACHED{color:var(--bulb)}
.pill.UNAVAILABLE{color:var(--ink-3)}
.stats{display:flex;gap:20px;flex-wrap:wrap;margin:10px 0 0;
  font:400 11px/1.7 var(--mono);letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-3)}
.stats b{color:var(--ink);font-weight:500}
.tabs{display:flex;gap:4px;margin:14px 0 -1px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;font:400 11px/1 var(--mono);letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-3);padding:9px 10px;
  border-bottom:1px solid transparent;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--bulb)}
.tabs .n{font:400 10px var(--mono);color:var(--ink-3);margin-left:6px;letter-spacing:0}

.pane{padding:18px 22px}
.warn{border-left:2px solid var(--bulb);padding:10px 14px;margin:0 0 16px;
  color:var(--ink-2);font-size:13px;max-width:80ch}
.warn b{color:var(--ink);font-weight:500}
.refuse{border-left:2px solid var(--neg);padding:11px 14px;margin:0 0 16px;
  color:var(--ink-2);font-size:13px;max-width:80ch}
.refuse b{color:var(--ink);font-weight:500}
p.note{font-size:12.5px;color:var(--ink-2);max-width:82ch;margin:0 0 12px;line-height:1.65}
.empty{color:var(--ink-3);font-size:12.5px}
h3.sec{font:400 19px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;
  margin:24px 0 10px;color:var(--ink)}
h3.sec:first-child{margin-top:0}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse}
th{text-align:left;font:400 10.5px/1 var(--mono);letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);padding:0 10px 9px 0;
  border-bottom:1px solid var(--rule);white-space:nowrap}
th.n,td.n{text-align:right;padding-right:0}
td{padding:8px 10px 8px 0;border-bottom:1px solid var(--rule);vertical-align:middle}
tr:hover td{background:var(--seat)}
.poster{width:31px;height:46px;object-fit:cover;border-radius:2px;display:block;
  background:var(--seat-2);border:1px solid var(--rule)}
.ttl{font-size:13.5px}
.num{font:400 12.5px var(--mono)}
.up{color:var(--pos)} .down{color:var(--neg)}
.mini{position:relative;height:6px;background:var(--seat-2);border-radius:1px}
.mini i{position:absolute;top:0;bottom:0;border-radius:1px;background:var(--pos)}
.flag{font:400 11px/1.5 var(--mono);color:var(--bulb);margin-top:2px}

/* ---------- posters ---------- */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));
  gap:13px;margin-top:4px}
.gal figure{margin:0}
.gal img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:3px;display:block;
  border:1px solid var(--rule);background:var(--seat-2)}
.gal figcaption{font-size:12px;color:var(--ink-2);margin-top:6px;line-height:1.4}
.gal.dim img{filter:grayscale(1) brightness(.5)}

/* ---------- the trace ---------- */
ol.steps{list-style:none;margin:0;padding:0;counter-reset:s}
ol.steps li{display:grid;grid-template-columns:28px 76px 1fr;gap:11px;
  padding:0 0 13px;counter-increment:s}
ol.steps li::before{content:counter(s,decimal-leading-zero);
  font:400 11px/1.6 var(--mono);color:var(--ink-3)}
.who{font:400 10px/1.7 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3)}
.who.buyer{color:var(--pos)} .who.home{color:var(--bulb)}
.act{font-size:13px;color:var(--ink)}
.why{font-size:12.5px;color:var(--ink-2);margin-top:2px;max-width:82ch;line-height:1.6}
.obs{font:400 11.5px/1.6 var(--mono);color:var(--ink-3);margin-top:3px}
.did{font:400 11.5px/1.6 var(--mono);color:var(--bulb);margin-top:3px}

.skel{height:46px;background:linear-gradient(90deg,var(--seat) 25%,var(--seat-2) 37%,
  var(--seat) 63%);background-size:400% 100%;animation:sh 1.3s ease infinite;
  border-radius:2px;margin:9px 0}
@keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
</style>

__NAV__
<div class="strip"></div>

<div class="shell">
  <aside class="side">
    <div class="grp" id="g-slate"></div>
    <div class="grp" id="g-buyer"></div>
    <div class="grp" id="g-home"></div>
    <button class="run" id="run">Rank slate</button>
    <button class="reset" id="reset">Reset to the worked example</button>
  </aside>
  <main class="main">
    <div class="rhead">
      <div class="rtitle"><h1 id="rh">Ranking…</h1><span id="src"></span></div>
      <div class="stats" id="stats"></div>
      <div class="tabs" id="tabs"></div>
    </div>
    <div id="pane" class="pane"></div>
  </main>
</div>

<script>
const EX={
 slate:['3 Idiots','Dangal','RRR','Sholay','Gully Boy','City of God','Elite Squad','La Haine',
        'Parasite','Amelie','Lagaan','Barfi!'],
 buyer:['The Wire','The Sopranos','Breaking Bad','Narcos','Snowfall','Goodfellas','Scarface','Training Day'],
 home:['Kabhi Khushi Kabhie Gham','Dilwale Dulhania Le Jayenge','Kuch Kuch Hota Hai','Jab We Met',
       'Yeh Jawaani Hai Deewani','Zindagi Na Milegi Dobara']};
const state={slate:[...EX.slate],buyer:[...EX.buyer],home:[...EX.home]};
let DATA=null, TAB='shortlist';

const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;
  if(x!==undefined)e.textContent=x;return e};
const $=id=>document.getElementById(id);
const fmt=v=>(v>=0?'+':'−')+Math.abs(v).toFixed(2);

const GROUPS=[
 {key:'slate', id:'g-slate', label:'Your slate', help:'Titles you are selling.'},
 {key:'buyer', id:'g-buyer', label:'Buyer', help:'What they have already licensed.'},
 {key:'home',  id:'g-home',  label:'Home audience', help:'Optional. What already works for you.'}];

function drawInputs(){
  GROUPS.forEach(g=>{
    const box=$(g.id); box.innerHTML='';
    const h=el('h2'); h.appendChild(document.createTextNode(g.label));
    h.appendChild(el('span','cnt',state[g.key].length+''));
    box.appendChild(h);
    box.appendChild(el('p','help',g.help));
    const chips=el('chips'.replace('chips','div'),'chips');
    state[g.key].forEach((t,i)=>{
      const miss=DATA&&DATA.slate&&g.key==='slate'&&(DATA.slate.missing||[]).includes(t);
      const c=el('span','chip'+(miss?' miss':''));
      c.appendChild(document.createTextNode(t));
      const b=el('button',null,'×'); b.title='Remove';
      b.onclick=()=>{state[g.key].splice(i,1);drawInputs()};
      c.appendChild(b); chips.appendChild(c);
    });
    box.appendChild(chips);
    const inp=el('input'); inp.type='text'; inp.placeholder='Add a title…';
    inp.onkeydown=e=>{ if(e.key==='Enter'&&inp.value.trim()){
      state[g.key].push(inp.value.trim()); inp.value=''; drawInputs(); } };
    box.appendChild(inp);
  });
}

function run(){
  $('run').disabled=true;
  $('rh').textContent='Ranking…'; $('src').innerHTML=''; $('stats').innerHTML='';
  $('tabs').innerHTML=''; $('pane').innerHTML='';
  for(let i=0;i<6;i++) $('pane').appendChild(el('div','skel'));
  fetch('/api/pitch',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(state)})
    .then(r=>r.json()).then(d=>{DATA=d;drawInputs();render()})
    .catch(e=>{$('pane').innerHTML='';$('pane').appendChild(el('p','empty',String(e)))})
    .finally(()=>{$('run').disabled=false});
}

function render(){
  const d=DATA, pane=$('pane');
  if(d.error){ $('rh').textContent='Could not rank'; pane.innerHTML='';
    pane.appendChild(el('p','note',d.error)); return; }
  $('rh').textContent='Shortlist for this buyer';
  $('src').innerHTML='<span class="pill '+(d.source||'')+'">'+(d.source||'')+'</span>';
  const st=$('stats'); st.innerHTML='';
  const put=(k,v)=>{const s=el('span');s.appendChild(document.createTextNode(k+' '));
    s.appendChild(el('b',null,v));st.appendChild(s)};
  put('slate',d.slate.resolved+' titles');
  put('buyer',d.buyer.resolved.length+' titles');
  if(d.buyer.halves_agree!=null) put('halves agree',d.buyer.halves_agree.toFixed(2));
  if(d.absolute) put('affinity',d.absolute.worst.toFixed(3)+'–'+d.absolute.best.toFixed(3));
  if(d.calls) put('qloo calls',d.calls);

  const tabs=[['shortlist','Shortlist',d.rows.length],
              ['withheld','Withheld',(d.withheld||[]).length],
              ['trace','How it decided',(d.steps||[]).length],
              ['ablation','Without Qloo',null],
              ['method','Method',null]];
  const tb=$('tabs'); tb.innerHTML='';
  tabs.forEach(([k,label,n])=>{
    const b=el('button',null,label); b.setAttribute('aria-selected',String(TAB===k));
    if(n!=null) b.appendChild(el('span','n',String(n)));
    b.onclick=()=>{TAB=k;render()}; tb.appendChild(b);
  });
  pane.innerHTML='';
  ({shortlist:paneShortlist,withheld:paneWithheld,trace:paneTrace,
    ablation:paneAblation,method:paneMethod}[TAB])(pane,d);
}

function paneShortlist(p,d){
  if(d.low_separation){
    const w=el('div','warn');
    w.innerHTML='<b>Low separation.</b> This buyer’s catalogue barely '
      +'distinguishes your titles from one another, so treat the top few as a '
      +'group rather than a strict order.';
    p.appendChild(w);
  }
  // One line here; the full definition lives in the Method tab.
  p.appendChild(el('p','note','Place is a rank among the titles you offered, not '
    +'a score \u2014 the raw affinity beside it is the absolute reading.'));
  const t=el('table');
  t.innerHTML='<thead><tr><th style="width:40px"></th><th>Title</th>'
    +'<th class="n" style="width:72px">Place</th>'
    +'<th class="n" style="width:74px">Affinity</th>'
    +'<th style="width:120px;padding-left:16px">Relative</th>'
    +'<th class="n" style="width:78px">Vs home</th></tr></thead>';
  const b=el('tbody');
  d.rows.forEach(r=>{
    const tr=el('tr');
    const td0=el('td');
    if(r.image){const im=new Image();im.className='poster';im.src=r.image;im.alt='';im.loading='lazy';td0.appendChild(im)}
    tr.appendChild(td0);
    const td1=el('td'); td1.appendChild(el('div','ttl',r.title));
    if(r.note) td1.appendChild(el('div','flag',r.note));
    if(r.invariant) td1.appendChild(el('div','flag','ranks the same for every buyer'));
    tr.appendChild(td1);
    tr.appendChild(el('td','n num',r.place||''));
    tr.appendChild(el('td','n num',r.affinity!=null?r.affinity.toFixed(3):'n/a'));
    const td4=el('td','bar-cell'); td4.style.paddingLeft='16px';
    const mini=el('div','mini'), f=el('i');
    f.style.left='0'; f.style.width=Math.round((r.fit||0)*100)+'%';
    mini.appendChild(f); td4.appendChild(mini); tr.appendChild(td4);
    const td5=el('td','n num '+(r.shift>=0?'up':'down'));
    td5.textContent=typeof r.shift==='number'?fmt(r.shift):'n/a';
    tr.appendChild(td5);
    b.appendChild(tr);
  });
  t.appendChild(b); p.appendChild(t);
  if(d.uncomparable&&d.uncomparable.length)
    p.appendChild(el('p','note','Scored for the buyer but not comparable against home: '
      +d.uncomparable.map(r=>r.title).join(', ')+'. Reporting them as no movement would be false.'));
}

function paneWithheld(p,d){
  const w=d.withheld||[];
  if(!w.length){ p.appendChild(el('p','empty','Nothing withheld: the two halves of the buyer’s catalogue agreed about every title.')); return; }
  p.appendChild(el('p','note','The buyer’s catalogue was split in two and read '
    +'separately. These titles landed in very different places in the two readings, '
    +'so no verdict is offered on them.'));
  const g=el('div','gal dim');
  w.forEach(t=>{const f=el('figure');
    const im=new Image(); im.src=(d.art&&d.art[t])||''; im.alt='';
    f.appendChild(im); f.appendChild(el('figcaption',null,t)); g.appendChild(f)});
  p.appendChild(g);
  if(d.excluded_overlap&&d.excluded_overlap.length)
    p.appendChild(el('p','note','Removed before scoring because they also describe the buyer: '
      +d.excluded_overlap.join(', ')+'. Qloo excludes an entity from its own results.'));
}

function paneTrace(p,d){
  p.appendChild(el('p','note','Each line is a decision. Where a reading was too '
    +'flat to separate anything, or two halves of a catalogue disagreed, the agent '
    +'changed what it did next.'));
  const ol=el('ol','steps');
  (d.steps||[]).forEach(s=>{
    const li=el('li');
    li.appendChild(el('div','who '+(s.profile||''),s.profile||''));
    const body=el('div');
    body.appendChild(el('div','act',s.action));
    if(s.reason) body.appendChild(el('div','why',s.reason));
    if(s.observed) body.appendChild(el('div','obs',s.observed));
    if(s.changed) body.appendChild(el('div','did','↪ '+s.changed));
    li.appendChild(body); ol.appendChild(li);
  });
  p.appendChild(ol);
}

function paneAblation(p,d){
  const l=d.llm;
  if(!l||!l.available){ p.appendChild(el('p','empty',(l&&l.note)||'No comparison available.')); return; }
  p.appendChild(el('p','note','The same question put to a language model that sees '
    +'only the two title lists: no Qloo, no affinities.'));
  p.appendChild(el('p','note','Top-five overlap is the measure to read. Full-list '
    +'agreement is a rank correlation over a dozen titles, where the null '
    +'standard error is around 0.2 \u2014 nearly as large as most values it takes '
    +'\u2014 and it is computed from the model\u2019s ordering, which is not '
    +'reliably reproducible between runs. Read a small value as no agreement '
    +'rather than as a measured disagreement. The '
    +'<a href="/evidence">evidence page</a> reports it as a range with its error.'));
  const st=el('div','stats');
  const put=(k,v)=>{const s=el('span');s.appendChild(document.createTextNode(k+' '));
    s.appendChild(el('b',null,v));st.appendChild(s)};
  if(typeof l.top5_overlap==='number'){
    put('top five',l.top5_overlap+' of 5 shared');
    put('different titles',(5-l.top5_overlap)+' of 5');
  }
  if(l.agreement!=null) put('full-list agreement',l.agreement.toFixed(2)+' (one run)');
  p.appendChild(st);
  if(l.placements&&l.placements.length){
    p.appendChild(el('p','note','The model picked these five. Shown unordered, '
      +'because its set of five is steadier than the order it puts them in. '
      +'Beside each is where this run ranked it \u2014 same pinned query, so it '
      +'is the grounded reading\u2019s own answer about the model\u2019s picks.'));
    const t=el('table');
    t.innerHTML='<thead><tr><th>The model\u2019s five</th>'
      +'<th class="n">Ranked here</th></tr></thead>';
    const b=el('tbody');
    [...l.placements].sort((x,y)=>x.title.localeCompare(y.title)).forEach(x=>{
      const tr=el('tr');
      tr.appendChild(el('td','ttl',x.title));
      let txt, cls='n num';
      if(x.shared){txt='both chose it';cls='n'}
      else if(x.withheld){txt='withheld';cls='n flag'}
      else if(x.grounded_place){txt='#'+x.grounded_place+' of '+x.of_ranked;cls='n num down'}
      else {txt='not ranked';cls='n'}
      tr.appendChild(el('td',cls,txt));
      b.appendChild(tr)});
    t.appendChild(b); p.appendChild(t);
  }
  p.appendChild(el('h3','sec','What this does and does not show'));
  p.appendChild(el('p','note','A frontier model is a strong baseline here and we are '
    +'not claiming otherwise: across every buyer and slate tried, including obscure '
    +'titles, it shares three to four of the top five. Its set of five is steady '
    +'across repeats at temperature zero; the order it puts them in is not, so we '
    +'compare sets rather than quoting a place from it.'));
  p.appendChild(el('p','note','It also declines when declining is offered. Asked the '
    +'same question with withholding explicitly available, it withheld 6/7/7 of twelve '
    +'on the recorded example \u2014 more than this agent did. What differs is what '
    +'the decision rests on: this agent withholds a title when two disjoint readings '
    +'of the audience place it far apart, which it can show you; the model withholds '
    +'on its own report of its confidence.'));
}

function paneMethod(p,d){
  const add=(h,t)=>{p.appendChild(el('h3','sec',h));p.appendChild(el('p','note',t))};
  add('Measured on the hackathon endpoint, not read from the docs',
    'filter.location.query is silently ignored for movies. Affinities come back '
    +'identical to four decimals across five cities, though it is honoured for '
    +'places. Affinity is not normalised per candidate set; it varies with the signal. '
    +'query.affinity is the taste score and popularity sits beside it, identical in '
    +'every market. take is capped at 50. Cross-domain signal varies enormously: TV '
    +'0.06, games 0.08, music 0.11 discriminate film taste; books, podcasts and places '
    +'barely or not at all.');
  add('What the numbers here mean',
    'Place is a rank among the titles you offered, not a score: first place reads first '
    +'even if this buyer is lukewarm about everything, which is why the raw affinity is '
    +'shown beside it. Vs home is that place minus its place with your home audience.');
  add('Validation, including where it fails',
    '11 of 11 regionally-skewed films rank highest with their own home audience '
    +'(p = 0.0005): a validity check rather than a finding, since we chose which '
    +'films count as regional. 10 of 11 survive replacing every anchor artist '
    +'(p = 0.0059), which is the result with weight. Cluster membership survives '
    +'bootstrap resampling for 67% of pairings. An external backtest against Wikipedia '
    +'pageview ranks, collected before any Qloo call, agrees in Mumbai and Berlin and '
    +'not in the other three markets.');
  add('What is not claimed',
    'The map’s eighteen audiences are clusters of cultural anchors grouped by '
    +'modelled film affinity: communities within Qloo’s graph, not observed '
    +'groups of people. Fifteen have too few members to cross-check and are drawn dashed. '
    +'The two readings of any audience share no anchors but come from the same graph, so '
    +'their agreement is a consistency check, not independent corroboration.');
  const a=el('p','note'); a.innerHTML='Everything above is reproducible from the '
    +'<a href="https://github.com/4KInc/travels-well" style="color:var(--accent)">repository</a>: '
    +'run_all.py for the API harness, atlas_build.py for the clustering and bootstrap. '
    +'The pre-registration and both amendments are committed.';
  p.appendChild(a);
}

$('run').onclick=run;
$('reset').onclick=()=>{state.slate=[...EX.slate];state.buyer=[...EX.buyer];state.home=[...EX.home];
  drawInputs();run()};
fetch('/status').then(r=>r.json()).then(s=>{
  if(s.quota_remaining!=null)
    $('quota').innerHTML='qloo quota <b>'+s.quota_remaining.toLocaleString()+'</b>';
}).catch(()=>{});
drawInputs(); run();
</script>
